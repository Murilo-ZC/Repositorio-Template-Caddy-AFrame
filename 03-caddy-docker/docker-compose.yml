services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"   # HTTP  (redireciona para HTTPS)
      - "8443:8443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data   # guarda a CA local entre execuções

volumes:
  caddy_data:
