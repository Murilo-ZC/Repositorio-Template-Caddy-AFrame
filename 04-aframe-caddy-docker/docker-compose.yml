services:
  aframe:
    build: .
    image: aframe-caddy
    ports:
      - "8080:8080"   # HTTP  (redireciona para HTTPS)
      - "8443:8443"   # HTTPS
    volumes:
      # Desenvolvimento: monta a pasta site/ por cima da cópia que está na
      # imagem, para que as edições no HTML apareçam sem refazer o build.
      # Remova esta linha para testar a imagem exatamente como será publicada.
      - ./site:/srv:ro
      - caddy_data:/data   # guarda a CA local entre execuções

volumes:
  caddy_data:
